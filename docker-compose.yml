services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: affluena_api
      POSTGRES_USER: affluena_api
      POSTGRES_PASSWORD: affluena_api
    ports:
      - "5432:5432"
    volumes:
      - affluena_api_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affluena_api -d affluena_api"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://affluena_api:affluena_api@postgres:5432/affluena_api?sslmode=disable
      JWT_SECRET: replace-with-a-long-random-secret
      RUN_MIGRATIONS: "true"
      RECURRING_SCHEDULER_ENABLED: "true"
      RECURRING_SCHEDULER_INTERVAL: 5s
      RECURRING_SCHEDULER_BATCH_SIZE: "20"
    ports:
      - "8080:8080"

volumes:
  affluena_api_postgres_data:
